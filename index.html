<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revue de presse JV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f0;
    --panel: #fffdf8;
    --text: #1f1d1a;
    --muted: #6b665e;
    --line: #e4dfd4;
    --accent: #b4432c;
    --accent-soft: #f6e4de;
    --chip: #efebe2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151413; --panel: #1c1b19; --text: #ebe7df; --muted: #9c968b;
      --line: #2e2c28; --accent: #e8795f; --accent-soft: #3a241e; --chip: #2a2825;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151413; --panel: #1c1b19; --text: #ebe7df; --muted: #9c968b;
    --line: #2e2c28; --accent: #e8795f; --accent-soft: #3a241e; --chip: #2a2825;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.6 Inter, system-ui, sans-serif;
  }
  a { color: var(--accent); }
  .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }
  aside {
    border-right: 1px solid var(--line); padding: 24px 20px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { font: 700 20px/1.2 "Source Serif 4", Georgia, serif; margin: 0 0 4px; }
  .brand a { color: inherit; text-decoration: none; }
  .tagline { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  aside h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 24px 0 8px; font-weight: 600;
  }
  aside ul { list-style: none; padding: 0; margin: 0; }
  aside li a {
    display: block; padding: 5px 10px; border-radius: 6px;
    color: var(--text); text-decoration: none; font-size: 14px;
  }
  aside li a:hover { background: var(--chip); }
  aside li a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .theme-btn {
    margin-top: 28px; background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer;
  }
  main { padding: 40px 48px 80px; }
  article { max-width: 720px; margin: 0 auto; }
  article h1 { font: 700 34px/1.2 "Source Serif 4", Georgia, serif; margin: 0 0 24px; }
  article h2 {
    font: 600 13px/1.3 Inter, sans-serif; text-transform: uppercase; letter-spacing: .08em;
    color: var(--accent); margin: 48px 0 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  article h3 { font: 600 21px/1.3 "Source Serif 4", Georgia, serif; margin: 28px 0 6px; }
  article p, article li { font-family: "Source Serif 4", Georgia, serif; font-size: 18px; }
  article blockquote {
    margin: 0 0 24px; padding: 10px 16px; border-left: 3px solid var(--line);
    color: var(--muted); font-style: italic;
  }
  article blockquote p { margin: 0; font-size: 16px; }
  .sources { font-family: Inter, sans-serif !important; font-size: 13px !important; color: var(--muted); margin: 4px 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 0; }
  .tag {
    font-size: 12px; background: var(--chip); color: var(--muted); padding: 2px 8px;
    border-radius: 999px; text-decoration: none;
  }
  .tag:hover { color: var(--accent); }
  .essentiel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px 20px; }
  .essentiel h2 { border: 0; margin-top: 16px; }
  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 56px; font-size: 14px; }
  .filter { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  .empty { color: var(--muted); }
  .menu-btn { display: none; }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; }
    aside nav { display: none; }
    aside.open nav { display: block; }
    .menu-btn {
      display: inline-block; background: none; border: 1px solid var(--line); color: var(--text);
      border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 14px; float: right;
    }
    .tagline { margin-bottom: 0; }
    main { padding: 24px 16px 60px; }
    article h1 { font-size: 26px; }
    article p, article li { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside id="side">
    <button class="menu-btn" onclick="document.getElementById('side').classList.toggle('open')">Menu</button>
    <p class="brand"><a href="#/">Revue de presse JV</a></p>
    <p class="tagline">L'actu jeu vidéo, chaque jour, en français</p>
    <nav>
      <h2>Revues</h2>
      <ul id="reviews"></ul>
      <h2>Sujets</h2>
      <ul id="topics"></ul>
      <button class="theme-btn" id="themeBtn">Changer de thème</button>
    </nav>
  </aside>
  <main><article id="content"><p class="empty">Chargement…</p></article></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script>
// Même liste que dans la tâche planifiée (Sujets/<fichier>.md)
const TOPICS = [
  "Industrie-et-business", "Sorties-et-annonces", "Studios-et-emploi", "Consoles-et-hardware",
  "PC", "Nintendo", "PlayStation", "Xbox", "Mobile", "Esport", "Tests-et-critiques"
];

let reviews = []; // [{date, path, summary}], la plus récente en premier

async function getText(path) {
  const res = await fetch(path, { cache: "no-cache" });
  if (!res.ok) throw new Error(path + " : " + res.status);
  return res.text();
}

// La liste des revues vient du README (une ligne "- [AAAA-MM-JJ](chemin) — résumé")
async function loadIndex() {
  const readme = await getText("README.md");
  const re = /^- \[(\d{4}-\d{2}-\d{2})\]\(([^)]+)\)\s*—?\s*(.*)$/gm;
  let m;
  while ((m = re.exec(readme))) reviews.push({ date: m[1], path: m[2], summary: m[3] });
  reviews.sort((a, b) => b.date.localeCompare(a.date));
}

function formatDate(iso) {
  return new Date(iso + "T12:00:00").toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "long", year: "numeric" });
}

function renderSidebar() {
  document.getElementById("reviews").innerHTML = reviews.length
    ? reviews.map(r => `<li><a href="#/revue/${r.date}" data-route="revue/${r.date}">${formatDate(r.date)}</a></li>`).join("")
    : `<li class="empty">Aucune revue</li>`;
  document.getElementById("topics").innerHTML = TOPICS
    .map(t => `<li><a href="#/sujet/${t}" data-route="sujet/${t}">${t.replace(/-/g, " ")}</a></li>`).join("");
}

function markActive(route) {
  document.querySelectorAll("aside a[data-route]").forEach(a => a.classList.toggle("active", a.dataset.route === route));
  document.getElementById("side").classList.remove("open");
}

// Transforme le HTML brut du markdown : liens internes, lignes Sources/Tags
function enhance(root, baseDir) {
  root.querySelectorAll("a[href]").forEach(a => {
    const href = a.getAttribute("href");
    if (/^https?:/.test(href)) { a.target = "_blank"; a.rel = "noopener"; return; }
    const date = href.match(/(\d{4}-\d{2}-\d{2})\.md$/);
    if (date) { a.setAttribute("href", "#/revue/" + date[1]); return; }
    const topic = href.match(/([\w-]+)\.md$/);
    if (topic && TOPICS.includes(topic[1])) a.setAttribute("href", "#/sujet/" + topic[1]);
  });
  // Résumé, "Sources : …" et "Tags : #a #b" arrivent dans un seul paragraphe séparé par des <br>
  root.querySelectorAll("p").forEach(p => {
    const lines = p.innerHTML.split(/<br\s*\/?>\s*/);
    if (lines.length < 2) return;
    const parts = lines.map(line => {
      const text = line.replace(/<[^>]+>/g, "").trim();
      if (/^Tags\s*:/.test(text)) {
        const tags = text.match(/#[\p{L}\p{N}_-]+/gu) || [];
        return `<div class="tags">${tags.map(t => `<a class="tag" href="#/tag/${encodeURIComponent(t.slice(1))}">${t}</a>`).join("")}</div>`;
      }
      if (/^Sources\s*:/.test(text)) return `<p class="sources">${line}</p>`;
      return `<p>${line}</p>`;
    });
    p.outerHTML = parts.join("");
  });
  // Encadré pour "L'essentiel en 3 points"
  const h2 = [...root.querySelectorAll("h2")].find(h => /essentiel/i.test(h.textContent));
  if (h2 && h2.nextElementSibling) {
    const box = document.createElement("div");
    box.className = "essentiel";
    const list = h2.nextElementSibling;
    h2.before(box); box.append(h2, list);
  }
}

function renderMarkdown(md) {
  const el = document.getElementById("content");
  el.innerHTML = DOMPurify.sanitize(marked.parse(md, { breaks: true }));
  enhance(el);
  return el;
}

async function showReview(date) {
  const i = reviews.findIndex(r => r.date === date);
  const r = reviews[i];
  const el = renderMarkdown(await getText(r ? r.path : `${date.slice(0, 4)}/${date.slice(5, 7)}/${date}.md`));
  const prev = reviews[i + 1], next = reviews[i - 1];
  const nav = document.createElement("div");
  nav.className = "nav";
  nav.innerHTML = `<span>${prev ? `<a href="#/revue/${prev.date}">← ${formatDate(prev.date)}</a>` : ""}</span>
                   <span>${next ? `<a href="#/revue/${next.date}">${formatDate(next.date)} →</a>` : ""}</span>`;
  el.append(nav);
}

// Recherche un tag dans toutes les revues et liste les actus correspondantes
async function showTag(tag) {
  const el = document.getElementById("content");
  el.innerHTML = `<h1>#${tag}</h1><p class="empty">Recherche…</p>`;
  const hits = [];
  for (const r of reviews) {
    const md = await getText(r.path).catch(() => "");
    for (const block of md.split(/^### /m).slice(1)) {
      const tags = (block.match(/^Tags\s*:(.*)$/m) || [, ""])[1];
      if (tags.split(/\s+/).includes("#" + tag)) hits.push({ date: r.date, title: block.split("\n")[0] });
    }
  }
  el.innerHTML = `<h1>#${tag}</h1><p class="filter">${hits.length} actu${hits.length > 1 ? "s" : ""}</p>` +
    (hits.length ? `<ul>${hits.map(h => `<li><a href="#/revue/${h.date}">${h.title}</a> <span class="sources">— ${formatDate(h.date)}</span></li>`).join("")}</ul>` : "");
}

async function route() {
  const hash = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const [kind, arg] = hash.split("/");
  try {
    if (kind === "revue" && arg) { markActive(hash); await showReview(arg); }
    else if (kind === "sujet" && arg) { markActive(hash); renderMarkdown(await getText(`Sujets/${arg}.md`)); }
    else if (kind === "tag" && arg) { markActive(""); await showTag(arg); }
    else if (reviews[0]) { location.replace("#/revue/" + reviews[0].date); return; }
    else document.getElementById("content").innerHTML = `<p class="empty">Aucune revue pour l'instant.</p>`;
  } catch (e) {
    document.getElementById("content").innerHTML = `<h1>Introuvable</h1><p class="empty">${e.message}</p>`;
  }
  window.scrollTo(0, 0);
}

// Thème clair/sombre mémorisé dans le navigateur
function applyTheme(t) { if (t) document.documentElement.dataset.theme = t; }
try { applyTheme(localStorage.getItem("theme")); } catch {}
document.getElementById("themeBtn").onclick = () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  const t = dark ? "light" : "dark";
  applyTheme(t);
  try { localStorage.setItem("theme", t); } catch {}
};

window.addEventListener("hashchange", route);
loadIndex()
  .catch(e => console.error(e))
  .then(() => { renderSidebar(); route(); });
</script>
</body>
</html>
